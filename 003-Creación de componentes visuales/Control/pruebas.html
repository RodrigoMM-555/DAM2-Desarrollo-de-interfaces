<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pruebas · GlyphCraft</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="glyphcraft-kit/tokens.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/three.module.js",
          "@mediapipe/tasks-vision": "./lib/mediapipe/vision_bundle.mjs",
          "glyphcraft-kit": "./glyphcraft-kit/glyphcraft-kit.js",
          "glyphcraft-kit/nucleo": "./glyphcraft-kit/nucleo.js",
          "glyphcraft-kit/seguimiento": "./glyphcraft-kit/seguimiento.js",
          "glyphcraft-kit/efectos": "./glyphcraft-kit/efectos.js",
          "glyphcraft-kit/glifos": "./glyphcraft-kit/glifos.js",
          "glyphcraft-kit/sinteticos": "./glyphcraft-kit/sinteticos.js"
        }
      }
    </script>
    <style>
      body { margin: 0; padding: 1.5rem; font: 15px/1.5 system-ui, sans-serif; background: #f7f5f0; color: #1f1b16; }
      h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
      .estado { margin: 0 0 1rem; font-weight: 600; }
      body[data-estado='ok'] .estado { color: #1d7a3a; }
      body[data-estado='fallo'] .estado { color: #b3261e; }
      .archivo { margin: 0.25rem 0; padding: 0.35rem 0.75rem; border-radius: 6px; background: #fff; border-left: 4px solid #1d7a3a; }
      .archivo.fallo { border-left-color: #b3261e; }
      summary { cursor: pointer; }
      .ok .icono, li.ok { color: #1d7a3a; }
      .fallo .icono, li.fallo { color: #b3261e; }
      .cuenta { color: #6b6257; font-size: 0.9em; }
      ul { margin: 0.25rem 0 0.5rem; padding-left: 1.25rem; list-style: none; font-size: 0.9em; }
      pre { margin: 0.2rem 0 0.4rem; white-space: pre-wrap; color: #7a1d17; }
      /* El iframe debe ser visible: algunas pruebas miden tamaños o hacen clic. */
      .marco { position: fixed; right: 1rem; bottom: 1rem; width: 640px; height: 420px; max-width: calc(100vw - 2rem); border: 1px solid #c9c0b3; background: #fff; }
      .marco iframe { width: 100%; height: 100%; border: 0; }
      /* Página interna (?archivo=…): sin estilos de listado. */
      @media (prefers-color-scheme: dark) {
        body { background: #14120f; color: #ede6da; }
        .archivo, .marco { background: #1f1c18; }
        .cuenta { color: #a99f92; }
        pre { color: #ffb4ab; }
      }
    </style>
  </head>
  <body>
    <h1>Pruebas de GlyphCraft</h1>
    <p class="estado">Preparando…</p>
    <div class="resultados"></div>
    <div class="marco"></div>
    <script type="module" src="pruebas/pagina.js"></script>
  </body>
</html>
